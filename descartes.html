<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Descartes Seletivo</title>
    <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #2e7d32;
      color: white;
      text-align: center;
      padding: 20px;
    }

    header h1 {
      margin: 0;
    }

    #cards {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      padding: 20px;
    }

    .card {
      background-color: white;
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 15px;
      width: 220px;
      text-align: center;
      box-shadow: 1px 1px 5px #ccc;
    }

    .card h2 {
      color: #2e7d32;
    }
  </style>
</head>
<body>

  <header>
    <h1>♻️ Descartes Seletivo</h1>
    <p>Descubra o ponto de coleta mais perto de você</p>
  </header>

  <section id="cards">

    <div class="card" data-tipo="reciclavel">
      <h2>Reciclável</h2>
      <p>Papel, plástico, vidro e metal. Separe e leve até um ecoponto.</p>
    </div>

    <div class="card" data-tipo="eletronico">
      <h2>Eletrônico</h2>
      <p>Pilhas, celulares e aparelhos velhos. Não jogue no lixo comum!</p>
    </div>

    <div class="card" data-tipo="outros">
      <h2>Outros</h2>
      <p>Óleo de cozinha, remédios vencidos e outros resíduos especiais.</p>
    </div>

  </section>

</body>
</html>
